name: Beta Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  beta:
    name: Build and publish beta zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;36.1.0"

      - name: Build module zip
        run: ./build.sh

      - name: Rename beta asset
        run: |
          cp sane-oos-qs.zip sane-oos-qs-beta.zip
          sha256sum sane-oos-qs-beta.zip > sane-oos-qs-beta.zip.sha256

      - name: Move beta tag
        run: |
          git tag -f beta "$GITHUB_SHA"
          git push -f origin beta

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta >/dev/null 2>&1 || \
            gh release create beta \
              --title "sane-oos-qs beta" \
              --notes "Automated beta build from main." \
              --prerelease

          gh release edit beta \
            --target "$GITHUB_SHA" \
            --title "sane-oos-qs beta" \
            --notes "Automated beta build from commit $GITHUB_SHA." \
            --prerelease

          gh release upload beta sane-oos-qs-beta.zip sane-oos-qs-beta.zip.sha256 --clobber
